# ============================================================
# SIGELAB - API para la app movil
# ============================================================
# Los valores se pueden cambiar con variables de entorno, igual
# que en el proyecto de escritorio (DB_URL, DB_USER, DB_PASSWORD).
# Asi la contrasena real nunca se sube a GitHub.

spring.application.name=sigelab-api

# Puerto HTTP de la API (variable PORT si el hosting la define)
server.port=${PORT:8080}

# Misma base de datos que la aplicacion de escritorio
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SigelabDB;encrypt=true;trustServerCertificate=true;sendTimeAsDatetime=false;}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:ProyecLAB26}

# Pool pequeno: es un proyecto universitario con pocos usuarios a la vez
spring.datasource.hikari.maximum-pool-size=5

# Horas que dura una sesion iniciada desde la app
sigelab.sesion.horas=12

# Intentos fallidos seguidos antes de bloquear un usuario en la app, y minutos de bloqueo
sigelab.login.max-intentos=5
sigelab.login.minutos-bloqueo=15

# Origenes que pueden llamar a la API desde un navegador (Flutter web en desarrollo)
sigelab.cors.origenes=http://localhost:*,http://127.0.0.1:*
